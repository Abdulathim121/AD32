        border-radius: 50%;

        content: "";

        position: absolute;
        right: 50%;
        bottom: -8px;

        width: 5px;
        height: 5px;

        background: var(--sh-bronze);

        box-shadow:

        transform:

    .saudi-brand-logo img {

        height: 100%;

        object-position: center;

    .saudi-nav-link::before {

        height: 2px;

        background: var(--sh-bronze);

        transition: width 0.25s ease;

        height: 4px;

        transition: opacity 0.25s ease;

    }

    .saudi-nav-link.active::before {

       Desktop Actions
    ========================================================= */

    .saudi-login-link:hover {

    }

    .saudi-login-link svg {
        width: 17px;
        height: 17px;

    .saudi-designer-button {

        padding: 0 18px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;

        color: #FFFFFF;

        border: 1px solid var(--sh-dark);

        text-decoration: none;

        font-size: 12px;
        font-weight: 500;

        transition: 0.25s ease;
    }

    .saudi-designer-button::before {
        content: "";

        position: absolute;
        right: -35px;
        top: -35px;

        width: 70px;
        height: 70px;

        border:

        transform: rotate(45deg);

        transform: translateY(-2px);

        z-index: 2;

        width: 16px;
        height: 16px;
    }


    /* =========================================================
       Mobile Details Menu
       يعتمد على HTML/CSS فقط
    ========================================================= */

    .saudi-mobile-menu {
        display: none;
        margin: 0;
        padding: 0;
    }

    .saudi-mobile-menu summary {
        list-style: none;
    }

    .saudi-mobile-menu summary::-webkit-details-marker {
        display: none;
    }

    .saudi-mobile-menu-button {
        width: 46px;
        height: 46px;

        display: flex;
        align-items: center;
        justify-content: center;

        border:
            1px solid var(--sh-border);

        background:
            rgba(255,255,255,0.38);

        cursor: pointer;

        transition:
            border-color 0.25s ease,
            background 0.25s ease;
    }

    .saudi-mobile-menu-button:hover {
        border-color: var(--sh-bronze);
        background: #FFFFFF;
    }

    .saudi-mobile-menu-lines {
        width: 20px;
        height: 15px;

        position: relative;
    }

    .saudi-mobile-menu-lines span {
        height: 1.5px;

        position: absolute;
        right: 0;

        border-radius: 20px;

        background: var(--sh-dark);

        transition:
            top 0.25s ease,
            width 0.25s ease,
            opacity 0.25s ease,
            transform 0.25s ease;
    }

    .saudi-mobile-menu-lines span:nth-child(1) {
        top: 0;
        width: 20px;
    }

    .saudi-mobile-menu-lines span:nth-child(2) {
        top: 6.5px;
        width: 14px;
    }

    .saudi-mobile-menu-lines span:nth-child(3) {
        top: 13px;
        width: 20px;
    }

    .saudi-mobile-menu[open]
    .saudi-mobile-menu-lines span:nth-child(1) {
        top: 6.5px;
        transform: rotate(45deg);
    }

    .saudi-mobile-menu[open]
    .saudi-mobile-menu-lines span:nth-child(2) {
        opacity: 0;
        transform: translateX(5px);
    }

    .saudi-mobile-menu[open]
    .saudi-mobile-menu-lines span:nth-child(3) {
        top: 6.5px;
        transform: rotate(-45deg);
    }


    /* =========================================================
       Mobile Panel
    ========================================================= */

    .saudi-mobile-panel {
        position: absolute;

        right: 0;
        left: 0;

        transform: rotate(45deg);

    }

        opacity: 1;
    }

    .saudi-mobile-identity {

    }

    .saudi-mobile-identity::before {
        content: "";

        width: 5px;
        height: 5px;

        background: var(--sh-bronze);

    }


    /* =========================================================
       Responsive

    @media (max-width: 1180px) {

    @media (max-width: 1060px) {

        }
    }


    @media (max-width: 920px) {

        .saudi-top-bar {
            display: none;
        }

        .saudi-main-header {
            background: rgba(245,241,232,0.99);
        }

        .saudi-header-container {
            width: min(calc(100% - 28px), 1320px);
            min-height: 78px;

            gap: 14px;
        }

        .saudi-brand {
            gap: 10px;
        }

        .saudi-brand-logo {

            height: 50px;

        }

        .saudi-brand-logo::before {

            height: 4px;

            bottom: -6px;
        }

        .saudi-brand-name {

            display: none;
        }

        .saudi-desktop-nav,
        .saudi-login-link,
        .saudi-designer-button {
            display: none;
        }

        .saudi-mobile-menu {
            display: block;
        }
    }


    @media (max-width: 480px) {

        .saudi-header-container {
            width: calc(100% - 22px);
            min-height: 74px;
        }

        .saudi-brand-logo {
            width: 46px;
            height: 46px;
        }

        .saudi-brand-name {
            font-size: 16px;
        }

        .saudi-mobile-menu-button {
            width: 43px;
            height: 43px;
        }

        .saudi-mobile-panel {
            max-height:
                calc(100vh - 74px);
        }
    }


    @media (max-width: 350px) {

        .saudi-brand-logo {
            width: 43px;
            height: 43px;
        }

        .saudi-brand-name {
            font-size: 15px;
        }

        .saudi-mobile-menu-button {
            width: 41px;
            height: 41px;
        }

        .saudi-mobile-actions {
            grid-template-columns: 1fr;
        }
    }

<script>

(function () {

    /*
        ملاحظة مهمة:
        فتح وإغلاق قائمة الجوال لا يعتمد على هذا السكربت.
        القائمة تعمل عبر <details> و <summary> من HTML نفسه.
        JavaScript هنا فقط للإضافات الثانوية.
    */


    const header =
        document.getElementById(
            "saudiHeader"
        );


    if (!header) {
        return;
    }


    /* =========================================================
       Scroll State
    ========================================================= */

    function updateHeaderState() {

        header.classList.toggle(
            "scrolled",
            window.scrollY > 20
        );

    }


    updateHeaderState();


    window.addEventListener(
        "scroll",
        updateHeaderState,
        {
            passive: true
        }
    );


    /* =========================================================
       Active Page
    ========================================================= */

    const desktopLinks =
        header.querySelectorAll(
            ".saudi-nav-link"
        );


    const mobileLinks =
        header.querySelectorAll(
            ".saudi-mobile-nav-link"
        );


    function clearActive() {

        desktopLinks.forEach(
            function (link) {
                link.classList.remove("active");
            }
        );


        mobileLinks.forEach(
            function (link) {
                link.classList.remove("active");
            }
        );

    }


    const currentFile =
        window.location.pathname
            .split("/")
            .pop()
            .toLowerCase();


    if (
        currentFile === "contact.html"
    ) {

        clearActive();


        const desktopContact =
            header.querySelector(
                '[data-page="contact"]'
            );


        const mobileContact =
            header.querySelector(
                '[data-mobile-page="contact"]'
            );


        if (desktopContact) {
            desktopContact.classList.add("active");
        }


        if (mobileContact) {
            mobileContact.classList.add("active");
        }

    } else {


        function setActiveFromHash() {

            clearActive();


            const section =
                window.location.hash
                    .replace("#", "") ||
                "home";


            let desktopActive =
                header.querySelector(
                    '[data-section="' +
                    section +
                    '"]'
                );


            let mobileActive =
                header.querySelector(
                    '[data-mobile-section="' +
                    section +
                    '"]'
                );


            if (!desktopActive) {

                desktopActive =
                    header.querySelector(
                        '[data-section="home"]'
                    );

            }


            if (!mobileActive) {

                mobileActive =
                    header.querySelector(
                        '[data-mobile-section="home"]'
                    );

            }


            if (desktopActive) {
                desktopActive.classList.add("active");
            }


            if (mobileActive) {
                mobileActive.classList.add("active");
            }

        }


        setActiveFromHash();


        window.addEventListener(
            "hashchange",
            setActiveFromHash
        );

    }


    /* =========================================================
       Close details after mobile link click
       هذه إضافة فقط، وليست ضرورية لفتح القائمة
    ========================================================= */

    const mobileMenu =
        document.getElementById(
            "saudiMobileMenu"
        );


    if (mobileMenu) {

        mobileMenu
            .querySelectorAll("a")
            .forEach(
                function (link) {

                    link.addEventListener(
                        "click",
                        function () {

                            mobileMenu.removeAttribute(
                                "open"
                            );

                        }
                    );

                }
            );

    }


    /* =========================================================
       Placeholder Links
    ========================================================= */

    header
        .querySelectorAll(
            'a[href="#"]'
        )
        .forEach(
            function (link) {

                link.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();

                    }
                );

            }
        );


})();

</script>
